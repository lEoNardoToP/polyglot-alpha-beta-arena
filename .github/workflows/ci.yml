name: Polyglot CI

on:
  push:
  pull_request:

jobs:
  core-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and compare implementations
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_verify_contract.py' -v
          python scripts/verify_contract.py \
            --languages python javascript c cpp java php csharp \
            --exhaustive-python --output reports/contract-core.json
      - uses: actions/upload-artifact@v4
        with:
          name: contract-core
          path: reports/contract-core.json

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift against the independent game oracle
        run: python3 scripts/verify_contract.py --languages swift --output reports/contract-swift.json
      - uses: actions/upload-artifact@v4
        with:
          name: contract-swift
          path: reports/contract-swift.json
